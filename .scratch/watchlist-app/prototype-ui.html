<!doctype html><!--wrap-->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><!--wrap-->
<title>Sessão a Dois</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. Answers: "What should the Combined Watchlist UI look like?"
  Three structurally different variants on one page, switch with the bottom bar, ←/→, or ?variant=A|B|C (#A|#B|#C also works).
    A "Foyer"     top bar + provider chip row, dense poster grid, side drawer detail (bottom sheet on phone)
    B "Programa"  editorial: filter sidebar (sheet on phone), titled posters, full-screen cinematic detail
    C "Bilheteria" sentence-style filters, master/detail split with a sticky detail pane
  Data: real TMDB pt-BR metadata + real BR streaming Offers (scraped 2026-10-14). Rent/buy Offers on Apple TV/Google Play are MOCK.
  Owners and date-added order are made up.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Shared chrome only; each variant owns its layout + tokens (body.vA / .vB / .vC). Single dark look on purpose (cinema). */
:root { color-scheme: dark; --bg: #131316; --fg: #ecebe6 }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; min-height: 100vh }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
img { max-width: 100%; display: block }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent, #fff); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
dialog { color: var(--fg); padding: 0; border: 0 }
dialog::backdrop { background: rgba(5, 5, 8, .72); backdrop-filter: blur(3px) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.empty { grid-column: 1 / -1; padding: 48px 0; color: var(--muted) }
.empty button { margin-left: 8px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px }

/* prototype switcher: deliberately NOT part of any design */
#proto { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  display: flex; align-items: center; gap: 2px; background: #fff; color: #111; border-radius: 999px; padding: 4px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .6); font: 600 13px/1 system-ui, sans-serif; white-space: nowrap }
#proto button { border: 0; background: #ececec; color: #111; width: 34px; height: 34px; border-radius: 50%; font-size: 16px }
#proto span { padding: 0 12px }

/* ============ A — Foyer ============ */
/* layout: sticky two-row toolbar (Owners segment + sort / Provider chips), dense poster grid, side drawer detail */
body.vA { --bg: #141417; --panel: #1d1d22; --line: #2c2c33; --fg: #ecebe6; --muted: #9d9ca5; --accent: #cfae6e; --sara: #e3a6a1; --vini: #93b5dc;
  --display: "Fraunces", Georgia, serif; font: 15px/1.5 "Manrope", system-ui, sans-serif }
.vA .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line) }
.vA .bar { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 14px 10px }
.vA .mark { font: 600 26px/1 var(--display); letter-spacing: -.01em; margin: 0; margin-right: auto; font-variation-settings: "opsz" 144 }
.vA .seg { display: flex; background: var(--panel); border-radius: 999px; padding: 3px; border: 1px solid var(--line) }
.vA .seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px }
.vA .seg button[aria-pressed="true"] { background: var(--accent); color: #1a1407 }
.vA .sort { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center }
.vA select, .vA .field input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px }
.vA .chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 12px; scrollbar-width: none }
.vA .chip { flex: none; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; color: var(--muted) }
.vA .chip img { width: 24px; height: 24px; border-radius: 6px }
.vA .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, transparent) }
.vA .chip.more { padding: 4px 14px; color: var(--fg); border-color: var(--muted) }
.vA .chip.plain { padding: 4px 12px }
.vA .count { color: var(--muted); font-size: 14px; margin: 18px 0 14px }
.vA .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; padding-bottom: 96px }
.vA .card { position: relative; border: 0; padding: 0; background: var(--panel); border-radius: 6px; aspect-ratio: 2 / 3; overflow: hidden; text-align: left;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); transition: transform .18s, box-shadow .18s }
.vA .card > img { width: 100%; height: 100%; object-fit: cover }
.vA .card:hover { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--accent), 0 14px 30px rgba(0, 0, 0, .5) }
.vA .card .own { position: absolute; top: 6px; left: 6px }
.vA .card .offers { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; padding: 26px 6px 6px; background: linear-gradient(transparent, rgba(0, 0, 0, .85)) }
.vA .card.na > img { filter: grayscale(.85) brightness(.7) }
.vA .na-badge { font-size: 11px; font-weight: 600; color: var(--muted); background: rgba(0, 0, 0, .7); border-radius: 4px; padding: 2px 6px }
.vA .tip { position: absolute; inset: auto 0 0; padding: 40px 10px 10px; background: linear-gradient(transparent, rgba(0, 0, 0, .95) 45%); opacity: 0; transition: opacity .15s }
.vA .tip b { display: block; font: 600 15px/1.2 var(--display) }
.vA .tip small { color: var(--muted) }
.vA .card:hover .tip, .vA .card:focus-visible .tip { opacity: 1 }
.vA .sheet { max-width: 100vw; width: min(460px, 100vw); max-height: 100vh; height: 100vh; margin: 0 0 0 auto; background: var(--panel); border-left: 1px solid var(--line) }
.vA .sheet-in { padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px 24px; display: grid; gap: 22px }
.vA .sheet h2 { font: 600 22px var(--display); margin: 0 }
.vA .field { display: grid; gap: 8px; font-size: 13px; color: var(--muted) }
.vA .field .chips { flex-wrap: wrap; padding: 0 }
.vA .sheet-foot { display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--panel); padding-block: 12px }
.vA .btn { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-weight: 700; background: var(--accent); color: #1a1407 }
.vA .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); flex: none }
.vA .drawer { max-width: 100vw; width: min(560px, 100vw); height: 100vh; max-height: 100vh; margin: 0 0 0 auto; background: var(--panel); overflow-y: auto; border-left: 1px solid var(--line) }
.vA .drawer[open] { animation: aIn .28s cubic-bezier(.2, .8, .2, 1) }
@keyframes aIn { from { transform: translateX(40px); opacity: 0 } }
.vA .bd { aspect-ratio: 16 / 9; max-width: 100%; background: center / cover; position: relative }
.vA .bd::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 40%, var(--panel)) }
.vA .x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); font-size: 20px }
.vA .dbody { padding: 0 24px 40px; margin-top: -72px; position: relative; display: grid; gap: 20px }
.vA .dhead { display: flex; gap: 18px; align-items: flex-end }
.vA .dhead img { width: 110px; border-radius: 6px; box-shadow: 0 12px 30px rgba(0, 0, 0, .6) }
.vA .dhead h2 { font: 600 30px/1.08 var(--display); margin: 0 0 6px; text-wrap: balance }
.vA .orig { color: var(--muted); margin: 0; font-style: italic }
.vA .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 }
.vA .ov { margin: 0; line-height: 1.65; max-width: 62ch }
.vA h3 { font: 600 13px/1 "Manrope", sans-serif; color: var(--muted); margin: 0 0 10px; letter-spacing: .02em }
.vA .olist { display: grid; gap: 8px }
.vA .orow { display: flex; align-items: center; gap: 12px }
.vA .orow img { width: 36px; height: 36px; border-radius: 8px }
.vA .orow .tags { margin-left: auto; display: flex; gap: 6px }
.vA .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted) }
.vA .links { display: flex; gap: 10px; flex-wrap: wrap }
.vA .links a { text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-weight: 600 }
.vA .links a:hover { border-color: var(--accent) }
@media (max-width: 640px) {
  .vA .bar { gap: 12px }
  .vA .seg { order: 3; width: 100%; justify-content: space-between }
  .vA .seg button { flex: 1; padding: 7px 4px }
  .vA .grid { grid-template-columns: repeat(3, 1fr); gap: 10px 8px }
  .vA .sheet, .vA .drawer { width: 100vw; height: auto; max-height: 92vh; margin: auto 0 0; border-radius: 18px 18px 0 0; border: 0 }
  .vA .drawer[open] { animation-name: aUp }
  @keyframes aUp { from { transform: translateY(60px); opacity: 0 } }
  .vA .x { top: 12px }
  .vA .dhead img { width: 84px }
  .vA .dhead h2 { font-size: 24px }
}

/* ============ B — Programa ============ */
/* layout: editorial two-column — sticky filter sidebar left, titled poster grid right; full-bleed cinematic detail */
body.vB { --bg: #17110f; --panel: #211816; --line: #3a2b27; --fg: #f0e6d6; --muted: #a8968a; --accent: #c4566a; --sara: #e9a07f; --vini: #9fb7c9;
  --display: "Bodoni Moda", "Didot", Georgia, serif; font: 15px/1.55 "Work Sans", system-ui, sans-serif }
.vB .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) }
.vB aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 36px 28px 120px; display: grid; gap: 30px; align-content: start }
.vB .mark { font: italic 400 34px/1 var(--display); margin: 0 }
.vB .mark small { display: block; font: 400 13px/1.4 "Work Sans", sans-serif; color: var(--muted); font-style: normal; margin-top: 10px }
.vB fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px }
.vB legend { font: 600 12px/1 "Work Sans", sans-serif; color: var(--accent); letter-spacing: .06em; padding: 0; margin-bottom: 10px }
.vB .who button { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border: 0; background: none; padding: 2px 0; font: 400 22px/1.3 var(--display); color: var(--muted); text-align: left }
.vB .who button small { font: 400 13px "Work Sans", sans-serif; font-variant-numeric: tabular-nums }
.vB .who button[aria-pressed="true"] { color: var(--fg); font-style: italic }
.vB .prov { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px }
.vB .prov button { border: 0; padding: 0; background: none; border-radius: 9px; opacity: .45; transition: opacity .15s }
.vB .prov button img { border-radius: 9px; width: 100% }
.vB .prov button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent) }
.vB .prov button:hover { opacity: 1 }
.vB .types { display: flex; flex-wrap: wrap; gap: 6px }
.vB .types button, .vB .sortrow button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted) }
.vB .types button[aria-pressed="true"], .vB .sortrow button[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 18%, transparent) }
.vB select, .vB input[type=range] { width: 100%; accent-color: var(--accent) }
.vB select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px }
.vB .two { display: grid; gap: 6px }
.vB .reset { justify-self: start; border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0 }
.vB main { padding-block: 40px 120px; min-width: 0 }
.vB .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 32px }
.vB .head h1 { font: 400 clamp(34px, 5vw, 64px)/1 var(--display); margin: 0; letter-spacing: -.02em }
.vB .head h1 i { color: var(--muted) }
.vB .sortrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px }
.vB .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 40px 26px }
.vB .card { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 10px; align-content: start }
.vB .poster { position: relative; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 3px; background: var(--panel) }
.vB .poster img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2, .8, .2, 1) }
.vB .card:hover .poster img { transform: scale(1.04) }
.vB .card.na .poster img { filter: grayscale(1) brightness(.65) }
.vB .na-badge { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: italic 400 15px var(--display); color: var(--fg) }
.vB .card h2 { font: 600 19px/1.15 var(--display); margin: 0; text-wrap: balance }
.vB .card p { margin: 0; color: var(--muted); font-size: 13px }
.vB .cardfoot { display: flex; align-items: center; gap: 10px; justify-content: space-between }
.vB .logos { display: flex; gap: 4px }
.vB .logos img { width: 22px; height: 22px; border-radius: 5px }
.vB .who-line { font-size: 12px; color: var(--muted) }
.vB .who-line b { font-weight: 500 }
.vB .fab { display: none }
.vB .full { width: 100vw; height: 100vh; max-width: none; max-height: none; background: var(--bg); overflow-y: auto }
.vB .full[open] { animation: bIn .5s ease-out }
@keyframes bIn { from { opacity: 0 } }
.vB .hero { position: relative; min-height: min(68vh, 720px); background: center 20% / cover; display: flex; align-items: flex-end }
.vB .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23, 17, 15, .2), rgba(23, 17, 15, .1) 40%, var(--bg)), linear-gradient(90deg, rgba(23, 17, 15, .7), transparent 70%) }
.vB .hero-in { position: relative; z-index: 1; padding-block: 0 28px; max-width: 1100px }
.vB .hero h2 { font: 400 clamp(40px, 8vw, 104px)/.95 var(--display); margin: 0; letter-spacing: -.025em; text-wrap: balance }
.vB .hero .orig { font: italic 400 clamp(18px, 2.4vw, 26px) var(--display); color: var(--muted); margin: 12px 0 0 }
.vB .x { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; border: 1px solid rgba(255, 255, 255, .3); background: rgba(0, 0, 0, .4); border-radius: 999px; padding: 8px 16px; backdrop-filter: blur(8px) }
.vB .dgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 56px; padding-block: 20px 120px; max-width: 1100px }
.vB .dgrid .ov { font: 400 19px/1.7 var(--display); margin: 0 0 28px; max-width: 60ch }
.vB dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 20px; margin: 0; font-size: 14px }
.vB dt { color: var(--muted) }
.vB dd { margin: 0 }
.vB .side { display: grid; gap: 28px; align-content: start }
.vB .orow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.vB .orow img { width: 34px; height: 34px; border-radius: 8px }
.vB .orow span:last-child { margin-left: auto; color: var(--muted); font-size: 13px }
.vB .links { display: flex; gap: 12px; flex-wrap: wrap }
.vB .links a { text-decoration: none; padding: 12px 20px; border: 1px solid var(--fg); border-radius: 999px; font-weight: 500 }
.vB .links a:first-child { background: var(--fg); color: var(--bg) }
@media (max-width: 900px) {
  .vB .layout { grid-template-columns: minmax(0, 1fr) }
  .vB aside { position: fixed; z-index: 20; inset: auto 0 0; height: auto; max-height: 86vh; background: var(--panel); border: 0; border-radius: 20px 20px 0 0;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, .6); transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)) }
  body.vB.sheet-open aside { transform: none }
  .vB .fab { display: block; position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 999px; padding: 12px 20px; background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .5) }
  .vB .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 14px }
  .vB .card h2 { font-size: 16px }
  .vB .dgrid { grid-template-columns: minmax(0, 1fr); gap: 32px }
  .vB .dgrid .ov { font-size: 17px }
}
@media (min-width: 560px) and (max-width: 900px) { .vB .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }

/* ============ C — Bilheteria ============ */
/* layout: a sentence is the filter bar; compact poster wall left, sticky detail pane right (full sheet on phone/tablet portrait) */
body.vC { --bg: #0f1117; --panel: #171a23; --line: #262a37; --fg: #e8e9f0; --muted: #8d92a6; --accent: #b6a5f4; --sara: #f2a6c4; --vini: #8fd3c7;
  --display: "Instrument Serif", Georgia, serif; font: 14px/1.5 "Geist", system-ui, sans-serif }
.vC header { padding-block: 26px 22px; border-bottom: 1px solid var(--line) }
.vC .mark { font: 600 13px/1 "Geist", sans-serif; color: var(--muted); margin: 0 0 14px; display: flex; gap: 10px; align-items: center }
.vC .mark i { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(90deg, var(--sara) 50%, var(--vini) 50%) }
.vC .sentence { font: 400 clamp(26px, 3.6vw, 44px)/1.3 var(--display); margin: 0; max-width: 1200px; text-wrap: pretty }
.vC .sentence select { field-sizing: content; appearance: none; -webkit-appearance: none; border: 0; background: none; font: italic 400 1em var(--display); color: var(--accent);
  border-bottom: 1.5px dashed color-mix(in srgb, var(--accent) 60%, transparent); padding: 0 2px; max-width: 100%; cursor: pointer }
.vC .sentence select:hover { border-bottom-style: solid }
.vC .sentence option { font: 15px "Geist", sans-serif; color: var(--fg); background: var(--panel) }
.vC .sub { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; color: var(--muted) }
.vC .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 500 }
.vC .pill b { color: var(--accent) }
.vC .split { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 28px; padding-block: 22px 100px; align-items: start }
.vC .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px }
.vC .card { position: relative; border: 0; padding: 0; background: var(--panel); aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; opacity: .82; transition: opacity .15s }
.vC .card:hover, .vC .card[aria-current="true"] { opacity: 1 }
.vC .card[aria-current="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent) }
.vC .card img { width: 100%; height: 100%; object-fit: cover }
.vC .card.na img { filter: grayscale(1) brightness(.6) }
.vC .card .na-badge { position: absolute; top: 6px; right: 6px; font-size: 10px; background: rgba(0, 0, 0, .75); border-radius: 3px; padding: 2px 5px; color: var(--muted) }
.vC .obar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; display: flex }
.vC .obar i { flex: 1 }
.vC .obar .s { background: var(--sara) }
.vC .obar .v { background: var(--vini) }
.vC .pane { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; scrollbar-width: thin }
.vC .pbd { aspect-ratio: 16 / 9; max-width: 100%; background: center / cover; border-radius: 14px 14px 0 0 }
.vC .pin { padding: 20px 22px 26px; display: grid; gap: 18px }
.vC .pin h2 { font: 400 40px/1 var(--display); margin: 0; text-wrap: balance }
.vC .pin .orig { margin: 6px 0 0; color: var(--muted); font-family: var(--display); font-style: italic; font-size: 19px }
.vC .whos { display: flex; gap: 6px }
.vC .who { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; color: #111 }
.vC .who.s { background: var(--sara) }
.vC .who.v { background: var(--vini) }
.vC .pin .ov { margin: 0; color: #c9ccd8; line-height: 1.6 }

const FILMS = DATA.films
const TYPE = { flatrate: 'Assinatura', free: 'Grátis', ads: 'Com anúncios', rent: 'Aluguel', buy: 'Compra' }
const TYPE_MARK = { ads: 'AD', rent: 'R$', buy: 'R$', free: '0' }
const COUNTRY = { KR: 'Coreia do Sul', JP: 'Japão', BR: 'Brasil', HK: 'Hong Kong', US: 'EUA', FR: 'França', GB: 'Reino Unido', AU: 'Austrália' }
const LANG = { ko: 'Coreano', ja: 'Japonês', pt: 'Português', zh: 'Cantonês', en: 'Inglês', fr: 'Francês', de: 'Alemão' }
const SORTS = [['added', 'Adicionados recentemente'], ['year', 'Ano'], ['runtime', 'Duração'], ['rating', 'Nota TMDB']]
const RUNTIMES = [['short', 'Até 1h40'], ['mid', 'Até 2h10'], ['long', 'Mais de 2h10']]
const uniq = a => [...new Set(a)]
const count = (arr) => Object.entries(arr.reduce((m, x) => (m[x] = (m[x] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]).map(e => e[0])
const PROVIDERS = count(FILMS.flatMap(f => uniq(f.offers.map(o => o.provider))))
const GENRES = uniq(FILMS.flatMap(f => f.genres)).sort((a, b) => a.localeCompare(b, 'pt'))
const DECADES = uniq(FILMS.map(f => Math.floor(f.year / 10) * 10)).sort((a, b) => b - a)
const COUNTRIES = uniq(FILMS.map(f => f.country)).sort((a, b) => COUNTRY[a].localeCompare(COUNTRY[b], 'pt'))
const LANGS = uniq(FILMS.map(f => f.language)).sort((a, b) => LANG[a].localeCompare(LANG[b], 'pt'))

const S = { owners: 'all', providers: new Set(), types: new Set(), genre: '', decade: '', runtime: '', country: '', language: '', minRating: 0, sort: 'added', sel: FILMS[0].tmdbId }
const blank = JSON.stringify({ ...S, providers: [], types: [], sel: 0 })

// Query semantics straight from the spec (the real Query module will own this)
function query(s = S, skip) {
  const r = FILMS.filter(f => {
    if (skip !== 'owners' && s.owners === 'both' && f.owners.length < 2) return false
    if (skip !== 'owners' && (s.owners === 'Sara' || s.owners === 'Vinicius') && !f.owners.includes(s.owners)) return false
    const offs = f.offers.filter(o => !s.types.size || s.types.has(o.type))
    if (s.types.size && !offs.length) return false
    if (s.providers.size && !offs.some(o => s.providers.has(o.provider))) return false
    if (s.genre && !f.genres.includes(s.genre)) return false
    if (s.decade && Math.floor(f.year / 10) * 10 !== +s.decade) return false
    if (s.runtime === 'short' && f.runtime > 100) return false
    if (s.runtime === 'mid' && f.runtime > 130) return false
    if (s.runtime === 'long' && f.runtime <= 130) return false
    if (s.country && f.country !== s.country) return false
    if (s.language && f.language !== s.language) return false
    return f.rating >= s.minRating
  })
  const by = { added: f => f.added, year: f => -f.year, runtime: f => f.runtime, rating: f => -f.rating }[s.sort]
  return r.sort((a, b) => by(a) - by(b))
}
const ownersCount = o => query({ ...S, owners: o }).length
const activeCount = () => [S.providers.size, S.types.size, S.genre, S.decade, S.runtime, S.country, S.language, S.minRating].filter(Boolean).length

// tiny formatting helpers
const h = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const rt = m => `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}min` : ''}`
const num = n => n.toFixed(1).replace('.', ',')
const films = n => `${n} ${n === 1 ? 'filme' : 'filmes'}`
const ownersText = f => f.owners.length > 1 ? 'Sara e Vinicius' : f.owners[0]
const byId = id => FILMS.find(f => f.tmdbId === +id)
const logoOf = p => img('w92', DATA.logos[p])
const byProvider = f => { // [{provider, types[]}], subscription-ish first
  const m = {}
  f.offers.forEach(o => (m[o.provider] ||= []).push(o.type))
  const rank = t => ['flatrate', 'free', 'ads', 'rent', 'buy'].indexOf(t)
  return Object.entries(m).map(([provider, types]) => ({ provider, types: types.sort((a, b) => rank(a) - rank(b)) })).sort((a, b) => rank(a.types[0]) - rank(b.types[0]))
}
const opts = (list, sel, all) => (all ? `<option value="">${all}</option>` : '') + list.map(([v, l]) => `<option value="${h(v)}"${String(sel) === String(v) ? ' selected' : ''}>${h(l)}</option>`).join('')
const ownBadge = f => `<span class="own" title="${ownersText(f)}">${f.owners.includes('Sara') ? '<i class="s">S</i>' : ''}${f.owners.includes('Vinicius') ? '<i class="v">V</i>' : ''}</span>`
const cardLogos = (f, max) => {
  const ps = byProvider(f), shown = ps.slice(0, max)
  return shown.map(p => `<span class="logo" title="${h(p.provider)}: ${p.types.map(t => TYPE[t]).join(', ')}"><img src="${logoOf(p.provider)}" alt="${h(p.provider)}" loading="lazy">${p.types[0] !== 'flatrate' ? `<b>${TYPE_MARK[p.types[0]]}</b>` : ''}</span>`).join('') + (ps.length > max ? `<span class="plus">+${ps.length - max}</span>` : '')
}
const lbUrl = f => `https://letterboxd.com/film/${f.slug}/`
const jwUrl = f => f.justwatch || `https://www.justwatch.com/br/busca?q=${encodeURIComponent(f.title)}`

const fieldSel = (key, list, all) => `<select data-f="${key}" id="${V.key}-${key}">${opts(list, S[key], all)}</select>`
const F = {
  genre: () => fieldSel('genre', GENRES.map(g => [g, g]), 'Todos os gêneros'),
  decade: () => fieldSel('decade', DECADES.map(d => [d, `Anos ${String(d).slice(2)}`.replace('Anos 00', 'Anos 2000').replace('Anos 10', 'Anos 2010').replace('Anos 20', 'Anos 2020')]), 'Qualquer década'),
  runtime: () => fieldSel('runtime', RUNTIMES, 'Qualquer duração'),
  country: () => fieldSel('country', COUNTRIES.map(c => [c, COUNTRY[c]]), 'Todos os países'),
  language: () => fieldSel('language', LANGS.map(l => [l, LANG[l]]), 'Todos os idiomas'),
  sort: () => fieldSel('sort', SORTS),
  rating: () => `<input type="range" min="0" max="9" step="0.5" value="${S.minRating}" data-f="minRating" id="${V.key}-rating" aria-label="Nota mínima TMDB">`,
  types: (cls = '') => Object.entries(TYPE).map(([t, l]) => `<button class="${cls}" data-toggle="types:${t}" aria-pressed="false">${l}</button>`).join(''),
}

/* ---------------- wiring ---------------- */
const VARIANTS = [A, B, C]
let V
const empty = () => `<p class="empty">Nenhum filme com esses filtros.<button data-reset>Limpar filtros</button></p>`

function update() {
  document.querySelectorAll('[data-region]').forEach(el => { el.innerHTML = V.regions[el.dataset.region]() })
  document.querySelectorAll('[data-toggle]').forEach(b => { const [k, v] = b.dataset.toggle.split(':'); b.setAttribute('aria-pressed', S[k].has(v)) })
  document.querySelectorAll('[data-owner]').forEach(b => b.setAttribute('aria-pressed', S.owners === b.dataset.owner))
  document.querySelectorAll('[data-sortbtn]').forEach(b => b.setAttribute('aria-pressed', S.sort === b.dataset.sortbtn))
  document.querySelectorAll('[data-f]').forEach(el => { const k = el.dataset.f; el.value = k === 'provider1' ? ([...S.providers][0] || '') : S[k] })
}
function show(key) {
  V = VARIANTS.find(v => v.key === key) || A
  document.body.className = 'v' + V.key
  document.getElementById('app').innerHTML = V.render()
  document.getElementById('plabel').textContent = `${V.key} (${V.name})`
  const u = new URL(location); u.searchParams.set('variant', V.key); u.hash = V.key
  try { history.replaceState(null, '', u) } catch { }
  update()
}
const step = d => show(VARIANTS[(VARIANTS.indexOf(V) + d + VARIANTS.length) % VARIANTS.length].key)

document.addEventListener('click', e => {
  const t = e.target
  if (t.tagName === 'DIALOG') return t.close() // backdrop click
  const el = t.closest('[data-owner],[data-toggle],[data-film],[data-open],[data-close],[data-reset],[data-sortbtn],[data-sheet],[data-closepane]')
  if (!el) return
  const d = el.dataset
  if (d.owner) S.owners = d.owner
  if (d.sortbtn) S.sort = d.sortbtn
  if (d.toggle) { const [k, v] = d.toggle.split(':'); S[k].has(v) ? S[k].delete(v) : S[k].add(v) }
  if (d.film) return V.open(byId(d.film))
  if (d.open) return document.getElementById(d.open).showModal()
  if ('close' in d) return el.closest('dialog').close()
  if ('sheet' in d) return document.body.classList.toggle('sheet-open')
  if ('closepane' in d) return document.body.classList.remove('pane-open')
  if ('reset' in d) Object.assign(S, JSON.parse(blank), { providers: new Set(), types: new Set(), sel: S.sel })
  update()
})
document.addEventListener('input', e => {
  const k = e.target.dataset.f
  if (!k) return
  if (k === 'provider1') S.providers = new Set(e.target.value ? [e.target.value] : [])
  else S[k] = k === 'minRating' ? +e.target.value : e.target.value
  update()
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.body.classList.remove('pane-open', 'sheet-open')
  if (e.target.closest('input,select,textarea,[contenteditable]') || document.querySelector('dialog[open]')) return
  if (e.key === 'ArrowLeft') step(-1)
  if (e.key === 'ArrowRight') step(1)
})
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
show(new URLSearchParams(location.search).get('variant') || location.hash.slice(1) || 'A')
const openId = new URLSearchParams(location.search).get('open') // screenshot helper: ?open=<tmdbId>
if (openId) V.open(byId(openId))
</script>
